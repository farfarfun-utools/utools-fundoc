name: Screenshots

# README 里的图是最容易过期的东西：改完界面没人记得重截一遍，而图和实物对不上
# 比没有图更糟。所以每打一个版本标签就重跑一遍，图真的变了才提交回 master。
#
# 触发用的是标签推送而不是 release 事件：release 如果是工作流里用 GITHUB_TOKEN
# 建的，GitHub 不会再为它派发新事件，挂在 release 上的工作流根本不会被唤醒。
#
# 具体步骤在组织共用的那份里，四个插件仓库是一模一样的流程：
# https://github.com/farfarfun-utools/.github/blob/master/.github/workflows/screenshots.yml
on:
  push:
    tags: ['v*']
  # 改完界面想立刻刷新 README 里的图时，手动点一下。
  workflow_dispatch:

# 必须在调用方给：被调用的工作流只能缩小、不能放大这里给出的权限。
permissions:
  contents: write

concurrency:
  # 两次运行同时往 master 推会撞车，排队跑，且不取消前一次（它可能已经在推了）。
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    uses: farfarfun-utools/.github/.github/workflows/screenshots.yml@master
